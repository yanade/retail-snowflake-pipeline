version: 2

sources:
  - name: raw
    description: "Change log loaded by loading.load_raw. One row per exported version of a key (ADR-020)."
    database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
    schema: raw
    tables:
      - name: currencies
        columns:
          - name: currency_code
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]   # dedupe and lead() order by it

      - name: product_categories
        columns:
          - name: category_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]

      - name: suppliers
        columns:
          - name: supplier_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]

      - name: products
        columns:
          - name: product_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]

      - name: customers
        columns:
          - name: customer_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]

      - name: customer_addresses
        columns:
          - name: address_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]

      - name: stores
        columns:
          - name: store_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]

      - name: employees
        columns:
          - name: employee_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]

      - name: exchange_rates
        columns:
          - name: exchange_rate_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]

      - name: orders
        columns:
          - name: order_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]

      - name: order_items
        columns:
          - name: order_item_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]

      - name: payments
        columns:
          - name: payment_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]
