version: 2

models:
  - name: dim_date
    description: "One row per calendar day between the dim_date_start and dim_date_end vars."
    columns:
      - name: date_key
        data_tests: [unique, not_null]
      - name: full_date
        data_tests: [unique, not_null]
  - name: dim_product
    description: "One row per product, with category and supplier flattened in (ADR-013). Type 1."
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [unique]
      - name: category_name
        data_tests: [not_null]   # left join must not hide an unresolved category
      - name: supplier_name
        data_tests: [not_null]
  - name: dim_store
    description: "One row per store or sales channel. The web store is a store, so every sale has one. Type 1."
    columns:
      - name: store_key
        data_tests: [unique, not_null]
      - name: store_code
        data_tests: [unique, not_null]
  - name: dim_customer
    description: "One row per customer plus unknown member -1 for guest checkouts (ADR-013). Type 1."
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [unique]     # null only on the unknown member
      - name: is_contactable
        data_tests: [not_null]
  - name: fact_sales
    description: "One row per order line (ADR-011). total_original is gross: quantity * unit_price, before discount, ex VAT. Filter revenue on order_status."
    columns:
      - name: sale_id
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - not_null                 # relationships skips nulls
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: store_key
        data_tests:
          - not_null                 # no unknown store: every sale has a channel
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [PENDING, PAID, SHIPPED, COMPLETED, CANCELLED, RETURNED]   # mirrors table_config.py
      - name: fx_rate_to_gbp
        data_tests: [not_null]
      - name: total_original
        data_tests: [not_null]
      - name: total_gbp
        data_tests: [not_null]       # a null measure would understate every sum (ADR-012)

  - name: fact_sales_rejected
    description: "Order lines that cannot enter fact_sales, with error_reason (ADR-012)."
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: error_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [missing_order, missing_fx_rate]

unit_tests:
  - name: fact_sales_incremental_picks_changed_inputs
    model: fact_sales
    overrides:
      macros:
        is_incremental: true                   # run the incremental branch against a fake existing table
    given:
      - input: ref('int_order_lines_routed')
        rows:
          - {order_item_id: 1, error_reason: null, line_loaded_at: "2025-02-01 10:00:00", order_loaded_at: "2025-02-01 10:00:00", rate_loaded_at: "2025-02-01 10:00:00"}   # unchanged
          - {order_item_id: 2, error_reason: null, line_loaded_at: "2025-02-01 10:00:00", order_loaded_at: "2025-02-05 10:00:00", rate_loaded_at: "2025-02-01 10:00:00"}   # status changed, line did not
          - {order_item_id: 3, error_reason: null, line_loaded_at: "2025-02-01 10:00:00", order_loaded_at: "2025-02-01 10:00:00", rate_loaded_at: "2025-02-05 10:00:00"}   # late or corrected rate
          - {order_item_id: 4, error_reason: missing_fx_rate, line_loaded_at: "2025-02-05 10:00:00", order_loaded_at: "2025-02-05 10:00:00", rate_loaded_at: null}  # new, not loadable
      - input: this
        rows:
          - {sale_id: 1, source_loaded_at: "2025-02-01 10:00:00"}
    expect:
      rows:
        - {sale_id: 2}
        - {sale_id: 3}
